<!DOCTYPE HTML>
<html>
<head>
    <meta charset="UTF-8"/>
    <meta content="width=device-width,initial-scale=1.0" name="viewport">
    <title>结果展示</title>
    <link href="https://cdn.bootcss.com/bootstrap/4.1.1/css/bootstrap.min.css" rel="stylesheet">
    <script src="https://cdn.bootcss.com/jquery/3.3.1/jquery.min.js"></script>
    <script src="https://cdn.bootcss.com/bootstrap/4.1.1/js/bootstrap.min.js"></script>
    <script src="https://cdn.bootcss.com/codemirror/5.38.0/codemirror.min.js"></script>
    <script src="https://cdn.bootcss.com/codemirror/5.38.0/mode/javascript/javascript.min.js"></script>
    <link href="https://cdn.bootcss.com/codemirror/5.38.0/codemirror.min.css" rel="stylesheet">
    <link href="https://cdn.bootcss.com/codemirror/5.38.0/theme/bespin.min.css" rel="stylesheet">
    <script src="https://cdn.bootcss.com/js-beautify/1.7.5/beautify.min.js"></script>
    <script src="https://cdn.bootcss.com/jszip/3.1.5/jszip.min.js"></script>
    <script type="text/javascript" src="data/answer.js"></script>
    <style media="screen">
  .clickable{
    cursor: pointer;
  }
  .CodeMirror {
    font-size: 1.5rem;
    font-family: Consolas!important;
  }
  .closeBtn{
    position: fixed;
    top: 20px;
    right: 40px;
    z-index: 99999;
  }
  .code_dialog{
    padding-right:0px!important;
  }
  </style>
</head>
<body>
<div class="container-fiuld pl-4 pr-4">
    <h1 class="mt-3">评测结果</h1>
    <div class="row">
        <table id="table" class="table table-striped table-hover"></table>
    </div>
</div>
</body>
<script type="text/javascript">
  var score_1 = 80
  var score_2 = 60
  var score_3 = 0
  var type = 'time'
  var order = true

  var refresh = ()=>{
    var line = 0
    var arr = data.filter((item)=>item).sort((l,h)=>{
      if (type == 'audio') {
        return l.app_wav.localeCompare(h.app_wav)
      } else if (type == 'time') {
        return l.app_time - h.app_time
      } else {
        alert('未知的排序类型：'+type)
        throw new Error()
      }
    })
    if (order) { arr.reverse() }
    var html = `<tr> <th>序号</th>
      <th id="audio" class="clickable" onclick="sortBy('audio')">音频</th>
      <th id="time" class="clickable" onclick="sortBy('time')">时间</th>
      <th>分数</th> <th>结果</th> <th>详情</th> </tr>`
    var index = 1
    arr.forEach((item)=>{
      var trClass = 'table-info'
      if (item.score > score_1) {
        trClass = 'table-success'
      } else if (item.score > score_2) {
        trClass = 'table-primary'
      } else {
        trClass = 'table-danger'
      }
      html += `<tr class="${trClass}">
        <td>${index++}</td>
        <td>${item.app_wav}<br><audio src="data/${item.app_wav}" controls="controls">您的浏览器不支持 audio 标签。</audio><br>
          <b>&nbsp;&nbsp;&nbsp;&nbsp;app_md5:</b><span class="text-info">${item.app_md5}</span><br>
          <b>engine_md5:</b><span class="text-info">${item.wav_online_md5}</span><br>
        </td>
        <td style="white-space:nowrap;">${new Date(Number(item.app_time)).Format('yyyy-MM-dd hh:mm:ss')}</td>
        <td>${item.score}<br>${getStars(item.score)}</td>
        <td>${getText(item)}</td>
        <td><button class="btn btn-primary" onclick="showDialog('${escape(JSON.stringify(item))}')">详情</button></td> </tr>`
    })
    $('#table').html(html)
    $('.bg-primary').removeClass('bg-primary')
    $(`#${type}`).addClass('bg-primary')
  }

  var getText = (obj)=>{
    if (obj.engine_type != 'PART_A') { return obj.engine_type }
    return obj.sentences.map((s)=>parseSentence(s)).join('')
  }

  var parseSentence = (sentence)=>{
    var text = sentence.text.split('').map((c)=>c.charCodeAt(0)>255?(c+c):c).join('')
    var words = sentence.words
    var result = ''
    var cur = 0
    for (var i = 0; i < words.length; i++) {
      var wordObj = words[i]
      result += inflateText(text.substr(cur, wordObj.start - cur))
      var word = inflateText(text.substr(wordObj.start, wordObj.length))
      var score = wordObj.score
      result+=generateWordSpan(word, score, wordObj)
      cur = wordObj.start + wordObj.length
    }
    return result
  }

  var generateWordSpan = (word, score, wordObj)=>{
    var className = 'text-info'
    if (score > score_1) {
      className = 'text-success'
    } else if (score > score_2) {
      className = 'text-primary'
    } else {
      className = 'text-danger'
    }
    return `<span class="${className}">${word}<sup>${score}</sup></span>`
  }

  var inflateText = (text)=>{
    var result = ''
    var cc = text.split('')
    for (var i = 0; i < cc.length; i++) {
      var c = cc[i]
      if(c.charCodeAt(0)>255){ i++ }
      result+=c
    }
    return result
  }

  var getStars = (score)=>{
    if(score>score_1){ return "⭐⭐⭐" }
    if(score>score_2){ return "⭐⭐" }
    return "⭐";
  }

  Date.prototype.Format = function (fmt) { //author: meizz
    var o = {
      "M+": this.getMonth() + 1, //月份
      "d+": this.getDate(), //日
      "h+": this.getHours(), //小时
      "m+": this.getMinutes(), //分
      "s+": this.getSeconds(), //秒
      "q+": Math.floor((this.getMonth() + 3) / 3), //季度
      "S": this.getMilliseconds() //毫秒
    };
    if (/(y+)/.test(fmt)) fmt = fmt.replace(RegExp.$1, (this.getFullYear() + "").substr(4 - RegExp.$1.length));
    for (var k in o)
    if (new RegExp("(" + k + ")").test(fmt)) fmt = fmt.replace(RegExp.$1, (RegExp.$1.length == 1) ? (o[k]) : (("00" + o[k]).substr(("" + o[k]).length)));
    return fmt;
  }

  var sortBy = (type_)=>{
    if (type == type_) {
      order = !order
    }
    type = type_
    refresh()
  }

  var showDialog = (json)=>{
    json = js_beautify(unescape(json))
    var dialog = $(`<div class="code_dialog modal bd-example-modal-lg" tabindex="-1" role="dialog">
      <textarea row='130'></textarea>
      <button class="closeBtn btn btn-primary">关闭</button>
    </div>`)
    $('body').append(dialog)
    dialog.modal('show')
    var editor = CodeMirror.fromTextArea(dialog.find("textarea")[0], {
      lineNumbers: true,
      matchBrackets : true,
      mode: {name: "javascript", globalVars: true}
    });
    editor.setOption("theme", "bespin")
    editor.setValue(json)
    editor.setSize("100%","100%");
    dialog.find('.closeBtn').click(()=>{
      dialog.modal('toggle')
      dialog.remove()
    })
  }

  refresh()
</script>
</html>
