<html>

<body>
  <div class="window">
    <p id="time" class="time">-1ms</p>
    <img src="loading.gif" />
    <div class="error-box">
      <p class="error-tip">启动客户端失败</p>
    </div>
  </div>
</body>
<script>
  function showErrorTip(tip) {
    let box = document.getElementsByClassName('error-box')
    let obj = document.getElementsByClassName('error-tip')
    for (const e of obj) e.innerHTML = tip
    for (const e of box) e.style["display"] = "block"
  }

</script>

<style>
  * {
    margin: 0;
    padding: 0;
  }

  .window {
    width: 100%;
    height: 100%;
  }

  .window img {
    width: 100%;
    max-width: 100%;
    max-height: 100%;
    object-fit: contain;
  }

  .time {
    position: absolute;
    left: 0;
    top: 0;
    display: none;
  }

  .error-box {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-color: #ffffff;
    border-radius: 16px;
    display: none;
  }

  .error-tip {
    font-size: 18px;
    margin: 12px;
    word-break: break-all;
  }

</style>

</html>
